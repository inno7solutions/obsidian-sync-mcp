# Team deployment: CouchDB + MCP server + admin UI, with Caddy for TLS.
#
# Many vaults, many users, one instance: each vault is a CouchDB database,
# each user one CouchDB account plus personal MCP tokens, all managed in the
# admin UI. See README "Team server".
#
# Setup:
#   1. Build the image:  npm ci && npm run build && docker build -t obsidian-mcp:team .
#   2. npm run env:init -- team PUBLIC_COUCHDB_URL=https://couch.<you> PUBLIC_MCP_URL=https://vault.<you>/mcp
#      (writes .env with random secrets; edit it by hand if you prefer).
#   3. Edit Caddyfile: replace the example hostnames with yours.
#   4. Point DNS at this host; open ports 80 and 443 (80 is needed for the
#      Let's Encrypt challenge).
#   5. docker compose -f deploy/team/docker-compose.yml --env-file deploy/team/.env up -d
#   6. Reach the admin UI through an SSH tunnel:  ssh -L 8788:127.0.0.1:8788 <host>
#      then open http://localhost:8788 and log in with ADMIN_TOKEN.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # persists issued TLS certs — back this up / don't delete
      - caddy_config:/config
    depends_on:
      - mcp

  couchdb:
    image: couchdb:3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_ADMIN_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD:?Set COUCHDB_ADMIN_PASSWORD in .env}
    volumes:
      - couchdb_data:/opt/couchdb/data
      # Not :ro — the couchdb entrypoint chowns local.d files; read-only makes it
      # exit 1 silently. Named to sort before docker.ini (see local-test compose).
      - ./couchdb-init.ini:/opt/couchdb/etc/local.d/00-livesync.ini
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u \"$$COUCHDB_USER:$$COUCHDB_PASSWORD\" http://localhost:5984/_up || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No "ports:" — Obsidian clients reach CouchDB through Caddy over TLS.

  admin:
    image: obsidian-mcp:team
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788" # loopback only: it holds the CouchDB admin credentials
    environment:
      ROLE: admin
      HOST: 0.0.0.0
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_ADMIN_USER: ${COUCHDB_ADMIN_USER:-admin}
      COUCHDB_ADMIN_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
      MCP_SERVICE_PASSWORD: ${MCP_SERVICE_PASSWORD:?Set MCP_SERVICE_PASSWORD in .env}
      REGISTRY_KEY: ${REGISTRY_KEY:?Set REGISTRY_KEY in .env}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?Set CREDENTIALS_KEY in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      PUBLIC_COUCHDB_URL: ${PUBLIC_COUCHDB_URL:?Set PUBLIC_COUCHDB_URL in .env}
      PUBLIC_MCP_URL: ${PUBLIC_MCP_URL:?Set PUBLIC_MCP_URL in .env}
      AUDIT_LOG_FILE: /data/admin-audit.jsonl
    volumes:
      - admin_data:/data
    depends_on:
      couchdb:
        condition: service_healthy

  mcp:
    image: obsidian-mcp:team
    restart: unless-stopped
    environment:
      ROLE: mcp
      COUCHDB_URL: http://couchdb:5984
      MCP_SERVICE_PASSWORD: ${MCP_SERVICE_PASSWORD}
      REGISTRY_KEY: ${REGISTRY_KEY}
      DATA_DIR: /data
      AUDIT_LOG_FILE: /data/audit.jsonl
    volumes:
      - mcp_data:/data
    depends_on:
      - admin
    # No "ports:" — reachable only via Caddy over TLS.

volumes:
  couchdb_data: {}
  mcp_data: {}
  admin_data: {}
  caddy_data: {}
  caddy_config: {}
